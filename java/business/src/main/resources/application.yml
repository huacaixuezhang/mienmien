server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:MienMieApp}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

mienmien:
  business:
    recycle:
      cleanup-cron: "0 30 3 * * *"
    jd-ai:
      # 百炼 OpenAI 兼容 Chat Completions，与控制台「HTTP 调用」文档一致；密钥勿提交仓库，用环境变量注入。
      # 控制台：https://bailian.console.aliyun.com/cn-beijing?tab=api#/api
      api-url: ${JD_AI_API_URL:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
      api-key: ${JD_AI_API_KEY:}
      model: ${JD_AI_MODEL:qwen-plus}
